<title>Tami's Edit Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an edit bay. A full-width timeline, caption cards and media on the left, a sticky monitor on the right (stacked on phones). */
:root {
  --bg: #e9ecef;
  --panel: #ffffff;
  --panel-2: #f4f6f8;
  --ink: #15191e;
  --muted: #5a636d;
  --line: #d3d9df;
  --accent: #b86a00;
  --accent-soft: #fbecd6;
  --accent-ink: #ffffff;
  --broll: #1b7a82;
  --broll-soft: #d9eff0;
  --live: #c93c3c;
  --live-soft: #fbe3e3;
  --ok: #23784b;
  --monitor: #0e1114;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --panel: #181c21; --panel-2: #1f242a; --ink: #e8ecf0; --muted: #98a2ac; --line: #2a3138;
    --accent: #f0a63a; --accent-soft: #3a2a12; --accent-ink: #1b1204; --broll: #56c4cb; --broll-soft: #15302f;
    --live: #ff7a7a; --live-soft: #3b1d1f; --ok: #63c891; --monitor: #07090b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --panel: #181c21; --panel-2: #1f242a; --ink: #e8ecf0; --muted: #98a2ac; --line: #2a3138;
  --accent: #f0a63a; --accent-soft: #3a2a12; --accent-ink: #1b1204; --broll: #56c4cb; --broll-soft: #15302f;
  --live: #ff7a7a; --live-soft: #3b1d1f; --ok: #63c891; --monitor: #07090b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font: 800 22px/1 var(--f-display); letter-spacing: -0.02em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand .clip { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.changed { color: var(--live); background: var(--live-soft); border-color: transparent; }
.pill.ok { color: var(--ok); }
.pill.broll { color: var(--broll); background: var(--broll-soft); border-color: transparent; }
.pill.sugg { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 13px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--live); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Workspace */
.bay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 18px 22px; align-items: start; }
.timeline-wrap { grid-column: 1 / -1; }
.monitor-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: grid; gap: 12px; }
@media (max-width: 860px) {
  .bay { grid-template-columns: minmax(0, 1fr); }
  .monitor-col { display: contents; }
  .monitor { order: -2; }
  .timeline-wrap { order: -1; }
  .monitor-col > .panel { order: 2; }
}

/* Timeline */
.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; display: grid; gap: 6px; }
.tl-head { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.tl-head b { font: 700 14px/1 var(--f-display); color: var(--ink); margin-right: auto; }
.tl-scroll { overflow-x: auto; }
.tl-body { position: relative; min-width: 560px; display: grid; grid-template-columns: 74px minmax(0, 1fr); row-gap: 5px; }
.tl-label { font: 600 11px/26px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.lane { position: relative; height: 26px; background: var(--panel-2); border-radius: 6px; cursor: pointer; }
.blk { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; padding: 0 6px; font-size: 11.5px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; text-align: left; }
.blk.cap { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.blk.cap.sel { background: var(--accent); color: var(--accent-ink); }
.blk.br { background: var(--broll); color: var(--panel); font-weight: 600; }
.blk.br.sugg { background: repeating-linear-gradient(135deg, var(--broll) 0 6px, color-mix(in srgb, var(--broll) 70%, var(--panel)) 6px 12px); }
.blk.ar { background: color-mix(in srgb, var(--ink) 14%, var(--panel-2)); color: var(--ink); }
.playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--live); pointer-events: none; border-radius: 1px; }
.tl-lanes { position: relative; display: grid; row-gap: 5px; }

/* Monitor */
.monitor { background: var(--monitor); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.frame { position: relative; margin: 0 auto; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; max-height: 62vh; border-radius: 10px; overflow: hidden; background: #000; }
@media (max-width: 860px) { .frame { max-height: 52vh; width: auto; height: 52vh; } }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; pointer-events: none; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame .demo-bg { position: absolute; inset: 0; background: linear-gradient(160deg, #6b8fa3, #d9b38c 70%, #b98a6b); }
.stage { position: absolute; inset: 0; container-type: size; overflow: hidden; pointer-events: none; }
.safe { position: absolute; inset: 0; pointer-events: none; }
.safe i { position: absolute; background: rgba(255, 60, 60, .16); border: 1px dashed rgba(255, 120, 120, .7); }
.safe .t { left: 0; right: 0; top: 0; height: 12%; }
.safe .b { left: 0; right: 0; bottom: 0; height: 22%; }
.safe .r { right: 0; top: 46%; bottom: 22%; width: 15%; }
.frame .tag { position: absolute; left: 10px; top: 10px; font: 600 11px/1 var(--f-mono); color: #fff; background: rgba(0,0,0,.55); padding: 5px 7px; border-radius: 5px; letter-spacing: .04em; text-transform: uppercase; }
.transport { display: flex; align-items: center; gap: 10px; color: #e8ecf0; }
.transport .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #f0a63a; color: #1b1204; font-weight: 800; display: grid; place-items: center; flex: none; }
.transport input[type=range] { flex: 1; min-width: 0; accent-color: #f0a63a; }
.transport .tc { font-size: 12px; color: #aab3bc; white-space: nowrap; }
.monitor-opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: #aab3bc; font-size: 13px; }
.monitor-opts select { background: #1c2126; color: #e8ecf0; border: 1px solid #333b44; border-radius: 6px; padding: 4px 6px; }
.monitor-opts label { display: inline-flex; gap: 6px; align-items: center; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.panel h2 { font: 700 15px/1.2 var(--f-display); margin: 0; }
.panel p { margin: 0; color: var(--muted); font-size: 13.5px; }
textarea, input[type=text] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sent { font-size: 12.5px; color: var(--ok); }
.renders { display: grid; gap: 6px; }
.render-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
.render-row .when { color: var(--muted); margin-right: auto; }

/* Left column */
.views { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.views button { border: 0; background: none; padding: 8px 12px 10px; font: 800 17px/1 var(--f-display); color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.views button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.views .count { font: 600 12px/1 var(--f-mono); color: var(--muted); margin-left: 4px; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.list-head p { margin: 0 auto 0 0; color: var(--muted); font-size: 13.5px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; transition: border-color .15s; }
.card.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.is-now .num { background: var(--accent); color: var(--accent-ink); }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.num { font: 600 12px/1 var(--f-mono); padding: 5px 7px; border-radius: 6px; background: var(--panel-2); }
.time { font-size: 12.5px; color: var(--muted); margin-right: auto; }
.preview-line { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; cursor: pointer; }
.preview-line em { font-style: normal; color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 7px 10px 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button.has { color: var(--broll); }
.pane { display: grid; gap: 9px; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint code { font-family: var(--f-mono); font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; text-align: left; }
.chip[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chip.clip[aria-pressed=true] { border-color: var(--broll); background: var(--broll-soft); }
.chip .sample { display: block; font-size: 17px; line-height: 1.15; }
.chip small { display: block; font: 400 11.5px/1.3 var(--f-mono); color: var(--muted); }
.slider { display: grid; grid-template-columns: 74px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--accent); }
.note-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.note-row textarea { min-height: 38px; height: 38px; font-size: 13.5px; }

/* Media */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.tile .thumb { position: relative; aspect-ratio: 16 / 10; background: #111; }
.tile .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .thumb .dur { position: absolute; right: 6px; bottom: 6px; font: 600 11px/1 var(--f-mono); color: #fff; background: rgba(0,0,0,.6); padding: 4px 5px; border-radius: 4px; }
.tile .thumb .role { position: absolute; left: 6px; top: 6px; font: 700 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; color: #fff; background: rgba(0,0,0,.6); }
.tile .thumb .role.a { background: var(--accent); color: var(--accent-ink); }
.tile .thumb .role.b { background: var(--broll); color: var(--panel); }
.tile .body { padding: 10px; display: grid; gap: 8px; align-content: start; }
.tile .name { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.tile .desc { font-size: 12.5px; color: var(--muted); }
.tile .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tile .tags span { font: 500 11px/1 var(--f-mono); padding: 4px 6px; background: var(--panel-2); border-radius: 4px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 5px 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed=true].a { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed=true].b { background: var(--broll); color: var(--panel); }

/* Empty / upload */
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 24px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--panel); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { font: 800 21px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.drop p { margin: 0; color: var(--muted); max-width: 52ch; }
.stack { display: grid; gap: 14px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
.steps b { color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<header class="top">
  <div class="brand"><h1>Edit<span>·</span>Bay</h1><span class="clip" id="clipName">No clip yet</span></div>
  <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Waiting for a clip</span></span>
  <button class="btn primary" id="renderBtn" disabled>Render video</button>
</header>

<main class="bay">
  <section class="timeline-wrap" aria-label="Timeline">
    <div class="timeline">
      <div class="tl-head"><b>Timeline</b><span>Click a block to jump to it</span></div>
      <div class="tl-scroll">
        <div class="tl-body">
          <span class="tl-label">Captions</span><div class="lane" id="laneCap"></div>
          <span class="tl-label">B-roll</span><div class="lane" id="laneB"></div>
          <span class="tl-label">A-roll</span><div class="lane" id="laneA"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="left" aria-label="Edit">
    <div class="views" role="tablist">
      <button role="tab" id="viewCaptions" aria-selected="true">Captions<span class="count" id="countCaptions"></span></button>
      <button role="tab" id="viewMedia" aria-selected="false">Media<span class="count" id="countMedia"></span></button>
    </div>
    <div id="leftBody"></div>
  </section>

  <aside class="monitor-col" aria-label="Preview">
    <div class="monitor">
      <div class="frame" id="frame">
        <div class="demo-bg" id="demoBg"></div>
        <video id="avid" playsinline preload="auto" muted></video>
        <video id="bvid" playsinline preload="auto" muted></video>
        <canvas id="comp"></canvas>
        <div class="stage" id="stage"></div>
        <div class="safe" id="safe" hidden><i class="t"></i><i class="b"></i><i class="r"></i></div>
        <span class="tag" id="frameTag">Example</span>
      </div>
      <div class="transport">
        <button class="play" id="playBtn" aria-label="Play">▶</button>
        <input type="range" id="scrub" min="0" max="10" step="0.01" value="0" aria-label="Playhead">
        <span class="tc mono" id="tc">00:00.0 / 00:10.0</span>
      </div>
      <div class="monitor-opts">
        <select id="viewSel" aria-label="What the monitor shows">
          <option value="live">Live preview</option>
          <option value="render" disabled>Latest render</option>
        </select>
        <label><input type="checkbox" id="safeChk"> Safe zones</label>
        <label><input type="checkbox" id="sfxChk" checked> Sound effects</label>
      </div>
    </div>

    <div class="panel" id="notePanel">
      <h2>A note for Claude</h2>
      <p>Anything about the whole edit. Then tell Claude in chat: “apply my notes”.</p>
      <textarea id="globalNote" rows="2" placeholder="e.g. put B-roll over every example I mention, and go softer in the middle"></textarea>
      <div class="row"><button class="btn small" id="globalNoteBtn">Send note</button><span class="sent" id="globalNoteSent"></span></div>
    </div>

    <div class="panel" id="renderPanel" hidden>
      <h2>Renders</h2>
      <p id="renderMsg"></p>
      <div class="renders" id="renders"></div>
    </div>
  </aside>
</main>
<div class="toast" id="toast" hidden></div>

<script src="overlay.js"></script>
<script src="sfx.js"></script>
<script>
(function () {
  "use strict";
  var EB = window.EditBay;
  var $ = function (id) { return document.getElementById(id); };
  var avid = $("avid"), bvid = $("bvid"), canvas = $("comp"), ctx = canvas.getContext("2d"), stage = $("stage"), scrub = $("scrub");

  // Shown until a real clip is loaded: the page's own example, not your footage.
  var EXAMPLE = [
    { id: "x1", i: 0, start: 0, end: 2.4, text: "So here's the *simplest* way to\nsound natural", look: { style: "serif", y: 0.3, size: 1, motion: "fade" } },
    { id: "x2", i: 1, start: 2.4, end: 4.8, text: "AND THEN I CAN GO LINE BY LINE", look: { style: "block", y: 0.68, size: 1, motion: "build" } },
    { id: "x3", i: 2, start: 4.8, end: 7.2, text: "Sounding natural on camera", look: { style: "hand", y: 0.18, size: 1, motion: "slide" } },
    { id: "x4", i: 3, start: 7.2, end: 10, text: "the trick is to *slow down*", look: { style: "clean", y: 0.8, size: 1, motion: "pop" } }
  ];

  var db = null, assets = null, canWrite = true;
  var project = null, segs = [], clips = [], renders = [];
  var pending = {}, timers = {}, openTab = {};
  var activeId = null, view = "captions", confirmRemove = null;
  var demo = true, demoT = 0, playing = false, lastT = 0, lastFrameAt = 0;

  try { var v = localStorage.getItem("eb-view"); if (v === "media" || v === "captions") view = v; } catch (e) {}

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3600);
  }
  function fmt(t) {
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = t - m * 60;
    return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
  }
  function blob(id) { return "/_blob/" + id; }
  function clipById(id) { return clips.filter(function (c) { return c.id === id; })[0] || null; }
  function mainClip() { return clips.filter(function (c) { return c.main; })[0] || null; }
  function brollClips() { return clips.filter(function (c) { return c.role === "b"; }); }
  function clipSrc(c) { return c ? blob(c.proxyAssetId || c.assetId) : null; }
  function mainSrc() {
    var m = mainClip();
    if (m) return clipSrc(m);
    if (project && project.proxy && project.proxy.assetId) return blob(project.proxy.assetId);
    if (project && project.source && project.source.assetId) return blob(project.source.assetId);
    return null;
  }
  function duration() {
    if (demo) return 10;
    var m = mainClip();
    return avid.duration || (m && m.duration) || (project && project.video && project.video.duration) || 0;
  }
  function now() { return demo ? demoT : avid.currentTime; }
  function liveSegs() {
    if (demo) return EXAMPLE;
    return segs.map(function (s) {
      var p = pending[s.id]; if (!p) return s;
      var o = Object.assign({}, s);
      if (p.text != null) o.text = p.text;
      if (p.look) o.look = Object.assign({}, s.look, p.look);
      if ("broll" in p) o.broll = p.broll;
      return o;
    });
  }
  function showingRender() { return $("viewSel").value === "render"; }

  // ---------- Monitor: canvas compositor ----------
  function sizeCanvas() {
    var r = $("frame").getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));

  }
  if (window.ResizeObserver) new ResizeObserver(function () { sizeCanvas(); drawFrame(); }).observe($("frame"));

  function syncB(p, t) {
    if (!p || showingRender()) { if (!bvid.paused) bvid.pause(); return null; }
    var c = clipById(p.clipId), src = clipSrc(c);
    if (!src) return null;
    var target = p.in + (t - p.start);
    if (bvid.getAttribute("src") !== src) { bvid.setAttribute("src", src); bvid.load(); bvid.__target = target; return null; }
    if (bvid.readyState < 1) { bvid.__target = target; return null; }
    if (playing) {
      if (Math.abs(bvid.currentTime - target) > 0.3) bvid.currentTime = target;
      if (bvid.paused) bvid.play().catch(function () {});
    } else {
      if (!bvid.paused) bvid.pause();

  function composite(t) {
    sizeCanvas();
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    if (demo) return;
    var aw = avid.videoWidth, ah = avid.videoHeight;
    if (avid.readyState >= 2 && aw) ctx.drawImage(avid, 0, 0, W, H);
    if (showingRender()) { syncB(null); return; }
    var p = EB.placementAt(EB.placements(liveSegs()), t);
    var c = syncB(p, t);
    if (p && c && bvid.videoWidth) {
      var r = EB.brollRects(p.layout, W, H, bvid.videoWidth, bvid.videoHeight, aw || W, ah || H);
      if (r.a2 && aw) ctx.drawImage(avid, r.a2.sx, r.a2.sy, r.a2.sw, r.a2.sh, r.a2.dx, r.a2.dy, r.a2.dw, r.a2.dh);
      ctx.drawImage(bvid, r.b.sx, r.b.sy, r.b.sw, r.b.sh, r.b.dx, r.b.dy, r.b.dw, r.b.dh);
    }
  }

  function drawFrame() {
    var t = now();
    composite(t);
    if (showingRender()) stage.innerHTML = ""; else EB.draw(stage, liveSegs(), t);
    var d = duration() || 10;
    scrub.max = String(d);
    scrub.value = String(t);
    $("tc").textContent = fmt(t) + " / " + fmt(d);
    syncPlayheads();
    markNow(t);
  }
  function markNow(t) {
    var cur = null;
    liveSegs().forEach(function (s) { if (t >= s.start && t < s.end) cur = s.id; });
    if (markNow.cur === cur) return;
    markNow.cur = cur;
    document.querySelectorAll(".card").forEach(function (c) { c.classList.toggle("is-now", c.dataset.id === cur); });
  }
  function tick(ts) {
    if (!playing) return;
    if (demo) {
      var dt = lastFrameAt ? (ts - lastFrameAt) / 1000 : 0;
      demoT += dt; if (demoT >= 10) demoT = 0;
    }
    lastFrameAt = ts;
    var t = now();
    if ($("sfxChk").checked && !showingRender() && t > lastT && t - lastT < 0.5) {
      EB.cuesBetween(liveSegs(), lastT, t).forEach(function (s) { playSfx(s.look.sfx); });
    }
    lastT = t;
    drawFrame();
    requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    $("playBtn").textContent = on ? "❚❚" : "▶";
    $("playBtn").setAttribute("aria-label", on ? "Pause" : "Play");
    if (!demo) {
      if (on) { avid.muted = false; avid.play().catch(function () { avid.muted = true; avid.play().catch(function () { setPlaying(false); }); }); }
      else { avid.pause(); bvid.pause(); }

  }
  function seek(t) {

  }
  function playSfx(name) {

  }
  $("playBtn").onclick = function () { setPlaying(!playing); };
  scrub.oninput = function () { seek(parseFloat(scrub.value)); };
  avid.addEventListener("ended", function () { setPlaying(false); });
  avid.addEventListener("loadedmetadata", function () {
    if (avid.videoWidth && avid.videoHeight && !showingRender()) $("frame").style.aspectRatio = avid.videoWidth + " / " + avid.videoHeight;
    renderTimeline(); drawFrame();
  });
  avid.addEventListener("loadeddata", drawFrame);
  avid.addEventListener("seeked", function () { if (!playing) drawFrame(); });
  $("safeChk").onchange = function () { $("safe").hidden = !this.checked; };
  $("viewSel").onchange = function () { applySource(); };

  function applySource() {
    var src = null, label = "Example";
    if (!demo) {

      else { src = mainSrc(); label = "Live preview"; }
    }
    $("demoBg").hidden = !!src;
    $("frameTag").textContent = label;
    if (src && avid.getAttribute("src") !== src) { var t = avid.currentTime || 0; avid.setAttribute("src", src); avid.load(); try { avid.currentTime = t; } catch (e) {} }
    if (!src && avid.getAttribute("src")) { avid.removeAttribute("src"); avid.load(); }
    drawFrame();
  }

  // ---------- Timeline ----------
  function renderTimeline() {
    var d = duration() || 10, list = liveSegs();
    var pct = function (x) { return (100 * x / d) + "%"; };
    var cap = $("laneCap"), lb = $("laneB"), la = $("laneA");
    cap.replaceChildren(); lb.replaceChildren(); la.replaceChildren();
    list.forEach(function (s) {
      var b = document.createElement("button"); b.className = "blk cap" + (s.id === activeId ? " sel" : "");
      b.style.left = pct(s.start); b.style.width = "calc(" + pct(s.end - s.start) + " - 2px)";
      b.textContent = EB.tokenize(s.text).map(function (x) { return x.text; }).join(" ");
      b.title = b.textContent;
      b.onclick = function (e) { e.stopPropagation(); openCard(s.id); };
      cap.appendChild(b);
    });
    EB.placements(list).forEach(function (p) {
      var c = clipById(p.clipId), seg = list.filter(function (s) { return s.id === p.segId; })[0];
      var b = document.createElement("button"); b.className = "blk br" + (seg && seg.broll && seg.broll.suggested ? " sugg" : "");
      b.style.left = pct(p.start); b.style.width = "calc(" + pct(p.end - p.start) + " - 2px)";

    } else {
      var ex = document.createElement("div"); ex.className = "blk ar"; ex.style.left = "0"; ex.style.width = "calc(100% - 2px)"; ex.textContent = "Example";

    cap.appendChild(ph);

  function syncPlayheads() {

  ["laneCap", "laneB", "laneA"].forEach(function (id) {

  function hasMain() { return !!(mainClip() || (project && (project.source || project.proxy))); }

  function card(s) {

    }
    if (cur === "Style") {
      pane.appendChild(chips(EB.STYLES, l.style, function (k) { edit(s.id, { look: { style: k } }); }, function (k, st) {
        var sm = document.createElement("span"); sm.className = "sample"; sm.textContent = st.upper ? "AA" : "Aa";
        sm.style.fontFamily = st.font; sm.style.fontWeight = st.weight || 400; return sm;
      }));

      pane.appendChild(slider("Size", 0.6, 1.6, 0.05, l.size, function (v) { return Math.round(v * 100) + "%"; }, function (v) { edit(s.id, { look: { size: v } }); }, "size-" + s.id));
    }
    if (cur === "Place") {
      var placeKey = Object.keys(EB.PLACES).filter(function (k) { return Math.abs(EB.PLACES[k].y - l.y) < 0.005; })[0];
      pane.appendChild(chips(EB.PLACES, placeKey, function (k) { edit(s.id, { look: { place: k, y: EB.PLACES[k].y } }); }));
      pane.appendChild(slider("Height", 0.06, 0.94, 0.01, l.y, function (v) { return Math.round(v * 100) + "%"; }, function (v) { edit(s.id, { look: { place: "custom", y: v } }); }, "y-" + s.id));

  function hint(html) { var d = document.createElement("div"); d.className = "hint"; d.innerHTML = html; return d; }
  function chips(map, cur, onPick, extra) {

  function slider(label, min, max, step, val, show, onChange, id) {

  function renderLeftSoon() { setTimeout(function () { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); renderLeft(); }, 0); }

  function select(id) {

    document.querySelectorAll(".card").forEach(function (c) { c.classList.toggle("is-active", c.dataset.id === id); });
    document.querySelectorAll(".blk.cap").forEach(function (b, i) { var s = liveSegs()[i]; b.classList.toggle("sel", !!s && s.id === id); });
  }

  // Local edit: the monitor updates at once; the change saves after a short pause.
  function edit(id, patch) {
    var p = pending[id] || (pending[id] = {});
    if (patch.text != null) p.text = patch.text;
    if (patch.look) p.look = Object.assign({}, p.look, patch.look);
    if ("broll" in patch) p.broll = patch.broll;
    select(id);
    drawFrame(); updateStatus(); renderTimeline();
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function () { flush(id); }, 600);
  }
  function flush(id) {
    var p = pending[id]; if (!p || !db) return Promise.resolve();
    var s = segs.filter(function (x) { return x.id === id; })[0]; if (!s) return Promise.resolve();
    var body = { changed: true };
    if (p.text != null) body.text = p.text;
    if (p.look) body.look = Object.assign({}, EB.look(s), p.look);
    if ("broll" in p) body.broll = p.broll;
    return db.doc("segments/" + id).update(body).then(function () {
      if (pending[id] === p) delete pending[id];
    }).catch(function (e) { writeFailed(e); });
  }
  function applyLookToAll() {

  function saveSegNote(id, text) {

      .then(function () { toast("Note sent. Tell Claude in chat: “apply my notes”"); })
      .catch(writeFailed);
  }
  $("globalNoteBtn").onclick = function () {
    if (!db) return;
    var text = $("globalNote").value.trim(); if (!text) return;
    var ref = db.doc("project/main"), note = { note: { text: text, at: Date.now(), done: false } };
    (project ? ref.update(note) : ref.set(note))
      .then(function () { $("globalNoteSent").textContent = "Sent. Tell Claude: “apply my notes”"; })
      .catch(writeFailed);
  };
  function writeFailed(e) {
    if (e && e.code === "invalid_argument") { canWrite = false; toast("You can view this edit but not change it."); renderLeft(); }
    else toast("Couldn't save that change. Check your connection and try again.");
  }

  // ---------- Media ----------
  function mediaView() {
    var wrap = document.createElement("div"); wrap.className = "stack";
    wrap.appendChild(dropZone(clips.length ? "Add more clips" : "Drop in your footage"));
    if (!clips.length) return wrap;
    var head = document.createElement("div"); head.className = "list-head";
    var p = document.createElement("p");
    var nb = brollClips().length;
    p.textContent = (mainClip() ? "A-roll: " + mainClip().name + ". " : "Pick your A-roll. ") + nb + " B-roll clip" + (nb === 1 ? "" : "s") + ". Tell Claude “sort my clips” to get descriptions and placement ideas.";
    head.appendChild(p);
    var grid = document.createElement("div"); grid.className = "media-grid";
    clips.forEach(function (c) { grid.appendChild(tile(c)); });
    wrap.append(head, grid);
    return wrap;
  }
  function tile(c) {
    var t = document.createElement("article"); t.className = "tile";
    var th = document.createElement("div"); th.className = "thumb";
    var v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = clipSrc(c) + "#t=0.5";
    v.addEventListener("mouseenter", function () { v.play().catch(function () {}); });
    v.addEventListener("mouseleave", function () { v.pause(); });
    var role = document.createElement("span"); role.className = "role " + (c.role === "a" ? "a" : "b"); role.textContent = c.main ? "A-roll · main" : c.role === "a" ? "A-roll" : "B-roll";
    var dur = document.createElement("span"); dur.className = "dur"; dur.textContent = c.duration ? fmt(c.duration) : "";
    th.append(v, role, dur);
    var body = document.createElement("div"); body.className = "body";
    var name = document.createElement("div"); name.className = "name"; name.textContent = c.name;
    body.appendChild(name);
    if (c.desc) { var d = document.createElement("div"); d.className = "desc"; d.textContent = c.desc; body.appendChild(d); }
    if (c.tags && c.tags.length) {
      var tg = document.createElement("div"); tg.className = "tags";
      c.tags.slice(0, 6).forEach(function (x) { var s = document.createElement("span"); s.textContent = x; tg.appendChild(s); });
      body.appendChild(tg);
    }
    var seg = document.createElement("div"); seg.className = "seg";
    [["a", "A-roll"], ["b", "B-roll"]].forEach(function (r) {
      var b = document.createElement("button"); b.className = r[0]; b.textContent = r[1]; b.disabled = !canWrite;
      b.setAttribute("aria-pressed", String(c.role === r[0]));
      b.onclick = function () { setRole(c, r[0]); };
      seg.appendChild(b);
    });
    var row = document.createElement("div"); row.className = "row"; row.appendChild(seg);
    if (c.role === "a" && !c.main) {
      var mk = document.createElement("button"); mk.className = "btn small"; mk.textContent = "Make main"; mk.disabled = !canWrite;
      mk.onclick = function () { makeMain(c); };
      row.appendChild(mk);
    }
    var rm = document.createElement("button"); rm.className = "btn small danger"; rm.disabled = !canWrite;
    rm.textContent = confirmRemove === c.id ? "Remove for good?" : "Remove";
    rm.onclick = function () {
      if (confirmRemove !== c.id) { confirmRemove = c.id; renderLeft(); return; }
      confirmRemove = null; removeClip(c);
    };
    row.appendChild(rm);
    body.appendChild(row);
    if (c.suggestedRole && c.suggestedRole !== c.role) {
      var sg = document.createElement("div"); sg.className = "hint";
      sg.textContent = "Claude thinks this is " + (c.suggestedRole === "a" ? "A-roll" : "B-roll") + ".";
      body.appendChild(sg);
    }
    t.append(th, body);
    return t;
  }
  function setRole(c, role) {
    if (!db || c.role === role) return;
    var body = { role: role };
    if (role === "b" && c.main) body.main = false;
    db.doc("clips/" + c.id).update(body).then(function () {
      if (role === "a" && !mainClip()) makeMain(Object.assign({}, c, { role: "a" }));
    }).catch(writeFailed);
  }
  function makeMain(c) {
    if (!db) return;
    var ops = clips.filter(function (x) { return x.main && x.id !== c.id; }).map(function (x) { return db.doc("clips/" + x.id).update({ main: false }); });
    Promise.all(ops).then(function () { return db.doc("clips/" + c.id).update({ main: true, role: "a" }); })
      .then(function () { return setProject({ source: { assetId: c.assetId, name: c.name, clipId: c.id } }); })
      .then(function () { toast(c.name + " is now the main A-roll"); })
      .catch(writeFailed);
  }
  function removeClip(c) {
    if (!db) return;
    var uses = segs.filter(function (s) { return s.broll && s.broll.clipId === c.id; });
    Promise.all(uses.map(function (s) { return db.doc("segments/" + s.id).update({ broll: null, changed: true }); }))
      .then(function () { return db.doc("clips/" + c.id).delete(); })
      .then(function () { toast("Removed " + c.name + (uses.length ? " and its " + uses.length + " B-roll placement" + (uses.length === 1 ? "" : "s") : "")); })
      .catch(writeFailed);
  }
  function setProject(patch) {
    var ref = db.doc("project/main");
    return project ? ref.update(patch) : ref.set(Object.assign({ at: Date.now() }, patch));
  }

  function dropZone(title) {
    var drop = document.createElement("div"); drop.className = "drop";
    var h = document.createElement("h2"); h.textContent = title;
    var p = document.createElement("p");
    p.textContent = "MP4, MOV or WebM, up to 20 MB each. Add your talking clip and any B-roll; you can mark which is which after. Bigger files: put them in Google Drive and tell Claude the folder.";
    var pick = document.createElement("button"); pick.className = "btn primary"; pick.textContent = "Choose videos";
    var input = document.createElement("input"); input.type = "file"; input.multiple = true; input.accept = "video/mp4,video/quicktime,video/webm,.mov,.mp4,.webm"; input.hidden = true;
    pick.onclick = function () { input.click(); };
    input.onchange = function () { uploadAll(Array.prototype.slice.call(input.files)); };
    drop.append(h, p, pick, input);
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { uploadAll(Array.prototype.slice.call(e.dataTransfer.files)); });
    if (!assets) { pick.disabled = true; p.textContent = "Uploading needs edit access to this page. You can still ask Claude to load clips from Google Drive."; }
    return drop;
  }

  function startView() {
    var wrap = document.createElement("div"); wrap.className = "stack";
    wrap.appendChild(dropZone("Drop in your footage to start"));
    var how = document.createElement("div"); how.className = "panel";
    how.innerHTML = '<h2>How it works</h2><ol class="steps">' +
      '<li><b>Upload your clips</b>: the talking take (A-roll) and any B-roll. The first one becomes your main A-roll.</li>' +
      '<li><b>Tell Claude “prep my clips”.</b> It transcribes you into caption cards, describes every B-roll clip and suggests where each fits.</li>' +
      '<li><b>Click to edit</b>: each caption card has Text, Style, Place, Motion, Sound and B-roll. The monitor and timeline update as you click.</li>' +
      '<li><b>Hit Render video</b>, then tell Claude “render my edit”. The finished video plays here.</li></ol>';
    wrap.appendChild(how);
    return wrap;
  }

  function readMeta(file) {
    return new Promise(function (res) {
      var v = document.createElement("video"), url = URL.createObjectURL(file), done = false;
      var finish = function (m) { if (done) return; done = true; URL.revokeObjectURL(url); res(m); };
      v.preload = "metadata"; v.muted = true;
      v.onloadedmetadata = function () { finish({ duration: v.duration || 0, w: v.videoWidth || 0, h: v.videoHeight || 0 }); };
      v.onerror = function () { finish({}); };
      setTimeout(function () { finish({}); }, 8000);
      v.src = url;
    });
  }
  function uploadAll(files) {
    if (!assets || !db || !files.length) return;
    var big = files.filter(function (f) { return f.size > 20 * 1024 * 1024; });
    files = files.filter(function (f) { return f.size <= 20 * 1024 * 1024; });
    if (big.length) toast(big.map(function (f) { return f.name; }).join(", ") + (big.length === 1 ? " is" : " are") + " over 20 MB. Put " + (big.length === 1 ? "it" : "them") + " in Google Drive and tell Claude.");
    var needMain = !mainClip();
    files.reduce(function (chain, f, i) {
      return chain.then(function () {
        toast("Uploading " + f.name + " (" + (i + 1) + " of " + files.length + ")…");
        return readMeta(f).then(function (m) {
          var type = /webm$/i.test(f.name) ? "video/webm" : "video/mp4";
          return assets.upload(f, { type: type }).then(function (r) {
            var isMain = needMain; needMain = false;
            var doc = { assetId: r.id, name: f.name, bytes: r.sizeBytes, role: isMain ? "a" : "b", main: isMain, at: Date.now(),
              duration: m.duration || null, w: m.w || null, h: m.h || null };
            return db.collection("clips").add(doc).then(function (ref) {
              if (isMain) return setProject({ source: { assetId: r.id, name: f.name, clipId: ref.id }, status: "uploaded" });
            });
          });
        });
      });
    }, Promise.resolve()).then(function () {
      if (files.length) toast("Uploaded. Tell Claude in chat: “prep my clips”");
    }).catch(function (e) {
      var m = { too_large: "A file is over 20 MB.", unsupported_type: "That file type isn't supported. Try an MP4.", quota_or_state: "Storage for this page is full." }[e && e.code];
      toast(m || "Upload failed. Try again in a moment.");
    });
  }

  // ---------- Render ----------
  $("renderBtn").onclick = function () {
    if (!db || !project) return;
    Promise.all(Object.keys(pending).map(flush)).then(function () {
      return db.doc("project/main").update({ render: { status: "requested", at: Date.now() } });
    }).then(function () { toast("Render requested. Tell Claude in chat: “render my edit”"); }).catch(writeFailed);
  };
  function renderRenders() {
    var r = project && project.render, panel = $("renderPanel");
    panel.hidden = !(r || renders.length);
    var msg = "";
    if (r && r.status === "requested") msg = "Requested. Tell Claude in chat: “render my edit”.";
    else if (r && r.status === "rendering") msg = "Claude is rendering. This page updates when it's done.";
    else if (r && r.status === "failed") msg = "The last render failed: " + (r.error || "ask Claude what happened.");
    else if (renders.length) msg = "Switch the monitor to “Latest render” to watch it.";
    $("renderMsg").textContent = msg;
    var box = $("renders"); box.replaceChildren();
    renders.slice(0, 5).forEach(function (rd, i) {
      var row = document.createElement("div"); row.className = "render-row";
      var w = document.createElement("span"); w.className = "when mono"; w.textContent = (rd.label || "Render") + " · " + new Date(rd.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      row.appendChild(w);
      if (i === 0) {
        var b = document.createElement("button"); b.className = "btn small"; b.textContent = "Watch";
        b.onclick = function () { $("viewSel").value = "render"; applySource(); seek(0); setPlaying(true); };
        row.appendChild(b);
      }
      box.appendChild(row);
    });
    var opt = $("viewSel").querySelector('option[value="render"]');
    opt.disabled = !renders.length;
    if (!renders.length && showingRender()) $("viewSel").value = "live";
  }

  function updateStatus() {
    var pill = $("statusPill"), txt = $("statusText");
    pill.className = "pill";
    if (demo) { txt.textContent = "Waiting for a clip"; }
    else if (!segs.length) { txt.textContent = "Waiting for captions"; }
    else if (project && project.render && project.render.status === "rendering") { txt.textContent = "Rendering…"; }
    else {
      var n = changedCount();
      if (n) { pill.className = "pill changed"; txt.textContent = n + " changed · not rendered"; }
      else { pill.className = "pill ok"; txt.textContent = renders.length ? "Rendered" : "Ready to render"; }
    }
    $("renderBtn").disabled = demo || !segs.length || !canWrite || !!(project && project.render && /requested|rendering/.test(project.render.status));
    var m = mainClip();
    $("clipName").textContent = m ? m.name : project && project.source ? project.source.name : "No clip yet";
  }

  // ---------- Data ----------
  function refreshDemo() {
    var wasDemo = demo;
    demo = !hasMain();
    if (wasDemo !== demo) { setPlaying(false); demoT = 0; }
  }
  function onProject(snap) {
    project = snap.exists ? snap.data() : null;
    refreshDemo(); applySource(); renderLeft(); renderRenders(); updateStatus();
  }
  function onSegments(snap) {
    segs = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
    segs.sort(function (a, b) { return a.start - b.start; });
    segs.forEach(function (s, i) { s.i = i; });
    renderLeft(); drawFrame(); updateStatus();
  }
  function onClips(snap) {
    clips = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
    clips.sort(function (a, b) { return (b.main ? 1 : 0) - (a.main ? 1 : 0) || (a.role === "a" ? -1 : 1) - (b.role === "a" ? -1 : 1) || (a.at || 0) - (b.at || 0); });
    refreshDemo(); applySource(); renderLeft(); updateStatus();
  }
  function onRenders(snap) {
    renders = snap.docs.map(function (d) { return d.data(); }).sort(function (a, b) { return b.at - a.at; });
    renderRenders(); updateStatus();
    if (showingRender()) applySource();
  }

  renderLeft(); updateStatus(); drawFrame();
  setPlaying(true);

  if (window.claude && window.claude.use) {
    window.claude.use("assets").then(function (a) { assets = a; renderLeft(); });
    window.claude.use("user").then(function (u) {
      if (!u) return;
      Promise.resolve(u.can("data.write")).then(function (w) { if (w === false) { canWrite = false; renderLeft(); updateStatus(); } });
    });
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      var err = function () { toast("Lost the connection to your edit. Reload to reconnect."); };
      db.doc("project/main").onSnapshot(onProject, err);
      db.collection("segments").onSnapshot(onSegments, err);
      db.collection("clips").onSnapshot(onClips, err);
      db.collection("renders").onSnapshot(onRenders, err);
    });
  }
})();
</script>
