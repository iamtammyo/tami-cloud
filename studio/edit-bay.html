<title>Tami's Edit Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an edit bay. Segment cards on the left, a sticky 9:16 monitor on the right (stacked on phones). */
:root {
  --bg: #e9ecef;
  --panel: #ffffff;
  --panel-2: #f4f6f8;
  --ink: #15191e;
  --muted: #5a636d;
  --line: #d3d9df;
  --accent: #b86a00;
  --accent-soft: #fbecd6;
  --accent-ink: #ffffff;
  --live: #c93c3c;
  --live-soft: #fbe3e3;
  --ok: #23784b;
  --monitor: #0e1114;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --panel: #181c21; --panel-2: #1f242a; --ink: #e8ecf0; --muted: #98a2ac; --line: #2a3138;
    --accent: #f0a63a; --accent-soft: #3a2a12; --accent-ink: #1b1204; --live: #ff7a7a; --live-soft: #3b1d1f; --ok: #63c891; --monitor: #07090b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --panel: #181c21; --panel-2: #1f242a; --ink: #e8ecf0; --muted: #98a2ac; --line: #2a3138;
  --accent: #f0a63a; --accent-soft: #3a2a12; --accent-ink: #1b1204; --live: #ff7a7a; --live-soft: #3b1d1f; --ok: #63c891; --monitor: #07090b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font: 800 22px/1 var(--f-display); letter-spacing: -0.02em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand .clip { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.changed { color: var(--live); background: var(--live-soft); border-color: transparent; }
.pill.ok { color: var(--ok); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 13px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Workspace */
.bay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 22px; align-items: start; }
.monitor-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: grid; gap: 12px; }
@media (max-width: 860px) {
  .bay { grid-template-columns: minmax(0, 1fr); }
  .monitor-col { display: contents; }
  .monitor { order: -1; }
  .monitor-col > .panel { order: 2; }
}

/* Monitor */
.monitor { background: var(--monitor); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.frame { position: relative; margin: 0 auto; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; max-height: 62vh; border-radius: 10px; overflow: hidden; background: #2a2f35; }
@media (max-width: 860px) { .frame { max-height: 52vh; width: auto; height: 52vh; } }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.frame .demo-bg { position: absolute; inset: 0; background: linear-gradient(160deg, #6b8fa3, #d9b38c 70%, #b98a6b); }
.stage { position: absolute; inset: 0; container-type: size; overflow: hidden; pointer-events: none; }
.safe { position: absolute; inset: 0; pointer-events: none; }
.safe i { position: absolute; background: rgba(255, 60, 60, .16); border: 1px dashed rgba(255, 120, 120, .7); }
.safe .t { left: 0; right: 0; top: 0; height: 12%; }
.safe .b { left: 0; right: 0; bottom: 0; height: 22%; }
.safe .r { right: 0; top: 46%; bottom: 22%; width: 15%; }
.frame .tag { position: absolute; left: 10px; top: 10px; font: 600 11px/1 var(--f-mono); color: #fff; background: rgba(0,0,0,.55); padding: 5px 7px; border-radius: 5px; letter-spacing: .04em; text-transform: uppercase; }
.transport { display: flex; align-items: center; gap: 10px; color: #e8ecf0; }
.transport .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #f0a63a; color: #1b1204; font-weight: 800; display: grid; place-items: center; flex: none; }
.transport input[type=range] { flex: 1; min-width: 0; accent-color: #f0a63a; }
.transport .tc { font-size: 12px; color: #aab3bc; white-space: nowrap; }
.monitor-opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: #aab3bc; font-size: 13px; }
.monitor-opts select { background: #1c2126; color: #e8ecf0; border: 1px solid #333b44; border-radius: 6px; padding: 4px 6px; }
.monitor-opts label { display: inline-flex; gap: 6px; align-items: center; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.panel h2 { font: 700 15px/1.2 var(--f-display); margin: 0; }
.panel p { margin: 0; color: var(--muted); font-size: 13.5px; }
textarea, input[type=text] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sent { font-size: 12.5px; color: var(--ok); }
.renders { display: grid; gap: 6px; }
.render-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
.render-row .when { color: var(--muted); margin-right: auto; }

/* Segment list */
.list-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.list-head h2 { font: 800 18px/1.1 var(--f-display); margin: 0 auto 0 0; letter-spacing: -0.01em; }
.cards { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; transition: border-color .15s; }
.card.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.is-now .num { background: var(--accent); color: var(--accent-ink); }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.num { font: 600 12px/1 var(--f-mono); padding: 5px 7px; border-radius: 6px; background: var(--panel-2); }
.time { font-size: 12.5px; color: var(--muted); margin-right: auto; }
.preview-line { font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
.preview-line em { font-style: normal; color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 7px 10px 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { display: grid; gap: 9px; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint code { font-family: var(--f-mono); font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
.chip[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chip .sample { display: block; font-size: 17px; line-height: 1.15; }
.slider { display: grid; grid-template-columns: 70px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.slider input { width: 100%; accent-color: var(--accent); }
.note-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.note-row textarea { min-height: 38px; height: 38px; font-size: 13.5px; }

/* Empty / upload */
.empty { display: grid; gap: 14px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--panel); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { font: 800 22px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.drop p { margin: 0; color: var(--muted); max-width: 46ch; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
.steps b { color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<header class="top">
  <div class="brand"><h1>Edit<span>·</span>Bay</h1><span class="clip" id="clipName">No clip yet</span></div>
  <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Waiting for a clip</span></span>
  <button class="btn primary" id="renderBtn" disabled>Render video</button>
</header>

<main class="bay">
  <section id="left" aria-label="Segments"></section>

  <aside class="monitor-col" aria-label="Preview">
    <div class="monitor">
      <div class="frame" id="frame">
        <div class="demo-bg" id="demoBg"></div>
        <video id="video" playsinline preload="metadata" hidden></video>
        <div class="stage" id="stage"></div>
        <div class="safe" id="safe" hidden><i class="t"></i><i class="b"></i><i class="r"></i></div>
        <span class="tag" id="frameTag">Example</span>
      </div>
      <div class="transport">
        <button class="play" id="playBtn" aria-label="Play">▶</button>
        <input type="range" id="scrub" min="0" max="10" step="0.01" value="0" aria-label="Playhead">
        <span class="tc mono" id="tc">00:00.0 / 00:10.0</span>
      </div>
      <div class="monitor-opts">
        <select id="viewSel" aria-label="What the monitor shows">
          <option value="live">Live preview</option>
          <option value="render" disabled>Latest render</option>
        </select>
        <label><input type="checkbox" id="safeChk"> Safe zones</label>
        <label><input type="checkbox" id="sfxChk" checked> Sound effects</label>
      </div>
    </div>

    <div class="panel" id="notePanel">
      <h2>A note for Claude</h2>
      <p>Anything about the whole edit. Then tell Claude in chat: “apply my notes”.</p>
      <textarea id="globalNote" rows="2" placeholder="e.g. everything a little bigger, and go softer in the middle section"></textarea>
      <div class="row"><button class="btn small" id="globalNoteBtn">Send note</button><span class="sent" id="globalNoteSent"></span></div>
    </div>

    <div class="panel" id="renderPanel" hidden>
      <h2>Renders</h2>
      <p id="renderMsg"></p>
      <div class="renders" id="renders"></div>
    </div>
  </aside>
</main>
<div class="toast" id="toast" hidden></div>

<script src="overlay.js"></script>
<script src="sfx.js"></script>
<script>
(function () {
  "use strict";
  var EB = window.EditBay;
  var $ = function (id) { return document.getElementById(id); };
  var video = $("video"), stage = $("stage"), scrub = $("scrub");

  // Shown until a real clip is loaded: the page's own example, not your footage.
  var EXAMPLE = [
    { id: "x1", start: 0, end: 2.4, text: "So here's the *simplest* way to\nsound natural", look: { style: "serif", y: 0.3, size: 1, motion: "fade" } },
    { id: "x2", start: 2.4, end: 4.8, text: "AND THEN I CAN GO LINE BY LINE", look: { style: "block", y: 0.68, size: 1, motion: "build" } },
    { id: "x3", start: 4.8, end: 7.2, text: "Sounding natural on camera", look: { style: "hand", y: 0.18, size: 1, motion: "slide" } },
    { id: "x4", start: 7.2, end: 10, text: "the trick is to *slow down*", look: { style: "clean", y: 0.8, size: 1, motion: "pop" } }
  ];

  var db = null, assets = null, canWrite = true;
  var project = null, segs = [], renders = [];
  var pending = {};      // segment id -> local edits not yet saved
  var timers = {};
  var openTab = {};      // segment id -> tab name
  var activeId = null;
  var demo = true, demoT = 0, playing = false, lastT = 0, lastFrameAt = 0;

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function fmt(t) {
    t = Math.max(0, t || 0);
    var m = Math.floor(t / 60), s = t - m * 60;
    return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
  }
  function duration() { return demo ? 10 : (video.duration || project && project.video && project.video.duration || 0); }
  function now() { return demo ? demoT : video.currentTime; }
  function liveSegs() {
    if (demo) return EXAMPLE;
    return segs.map(function (s) { return pending[s.id] ? Object.assign({}, s, pending[s.id], { look: Object.assign({}, s.look, (pending[s.id] || {}).look) }) : s; });
  }
  function showingRender() { return $("viewSel").value === "render"; }

  // ---------- Monitor ----------
  function drawFrame() {
    var t = now();
    if (showingRender()) stage.innerHTML = ""; else EB.draw(stage, liveSegs(), t);
    scrub.max = String(duration() || 10);
    scrub.value = String(t);
    $("tc").textContent = fmt(t) + " / " + fmt(duration());
    markNow(t);
  }
  function markNow(t) {
    var cur = null;
    liveSegs().forEach(function (s) { if (t >= s.start && t < s.end) cur = s.id; });
    if (markNow.cur === cur) return;
    markNow.cur = cur;
    document.querySelectorAll(".card").forEach(function (c) { c.classList.toggle("is-now", c.dataset.id === cur); });
  }
  function tick(ts) {
    if (!playing) return;
    if (demo) {
      var dt = lastFrameAt ? (ts - lastFrameAt) / 1000 : 0;
      demoT += dt; if (demoT >= 10) demoT = 0;
    }
    lastFrameAt = ts;
    var t = now();
    if ($("sfxChk").checked && !showingRender() && t > lastT && t - lastT < 0.5) {
      EB.cuesBetween(liveSegs(), lastT, t).forEach(function (s) { playSfx(s.look.sfx); });
    }
    lastT = t;
    drawFrame();
    requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    $("playBtn").textContent = on ? "❚❚" : "▶";
    $("playBtn").setAttribute("aria-label", on ? "Pause" : "Play");
    if (!demo) { if (on) video.play().catch(function () { setPlaying(false); }); else video.pause(); }
    lastT = now(); lastFrameAt = 0;
    if (on) requestAnimationFrame(tick);
  }
  function seek(t) {
    if (demo) demoT = t; else video.currentTime = t;
    lastT = t; drawFrame();
  }
  function playSfx(name) {
    var src = window.EditBaySFX && window.EditBaySFX[name];
    if (!src) return;
    try { var a = new Audio(src); a.volume = 0.6; a.play().catch(function () {}); } catch (e) {}
  }
  $("playBtn").onclick = function () { setPlaying(!playing); };
  scrub.oninput = function () { seek(parseFloat(scrub.value)); };
  video.addEventListener("ended", function () { setPlaying(false); });
  video.addEventListener("loadedmetadata", function () {
    if (video.videoWidth && video.videoHeight) $("frame").style.aspectRatio = video.videoWidth + " / " + video.videoHeight;
    drawFrame();
  });
  video.addEventListener("seeked", drawFrame);
  $("safeChk").onchange = function () { $("safe").hidden = !this.checked; };
  $("viewSel").onchange = function () { applySource(); };

  function applySource() {
    var src = null, label = "Example";
    if (!demo && project) {
      if (showingRender() && renders[0]) { src = "/_blob/" + renders[0].assetId; label = "Render"; }
      else {
        var id = (project.proxy && project.proxy.assetId) || (project.source && project.source.assetId);
        if (id) { src = "/_blob/" + id; label = "Live preview"; }
      }
    }
    $("demoBg").hidden = !!src;
    video.hidden = !src;
    $("frameTag").textContent = label;
    if (src && video.getAttribute("src") !== src) { var t = video.currentTime || 0; video.src = src; video.currentTime = t; }
    drawFrame();
  }

  // ---------- Segment cards ----------
  function changedCount() { return segs.filter(function (s) { return s.changed || pending[s.id]; }).length; }

  function renderLeft() {
    var left = $("left");
    if (!project || !(project.source || project.proxy)) { left.replaceChildren(uploadView()); return; }
    if (!segs.length) { left.replaceChildren(waitingView()); return; }
    var focus = document.activeElement && document.activeElement.closest && document.activeElement.closest(".card");
    if (focus) return; // don't rebuild under the cursor; snapshots fold in on blur

    var head = document.createElement("div");
    head.className = "list-head";
    var h = document.createElement("h2"); h.textContent = "Captions"; head.appendChild(h);
    var c = document.createElement("span"); c.className = "pill mono"; c.textContent = segs.length + " segments"; head.appendChild(c);
    var all = document.createElement("button"); all.className = "btn small"; all.textContent = "Apply selected look to all";
    all.disabled = !activeId || !canWrite;
    all.onclick = applyLookToAll;
    head.appendChild(all);

    var list = document.createElement("div"); list.className = "cards";
    liveSegs().forEach(function (s) { list.appendChild(card(s)); });
    left.replaceChildren(head, list);
    markNow.cur = undefined; markNow(now());
  }

  function card(s) {
    var l = EB.look(s), el = document.createElement("article");
    el.className = "card" + (s.id === activeId ? " is-active" : "");
    el.dataset.id = s.id;
    el.addEventListener("focusout", function () { setTimeout(function () { if (!el.contains(document.activeElement)) renderLeft(); }, 0); });

    var top = document.createElement("div"); top.className = "card-top";
    top.innerHTML = '<span class="num"></span><span class="time mono"></span>';
    top.querySelector(".num").textContent = "#" + String(s.i + 1).padStart(4, "0");
    top.querySelector(".time").textContent = s.start.toFixed(2) + "s → " + s.end.toFixed(2) + "s";
    if (s.changed || pending[s.id]) { var p = document.createElement("span"); p.className = "pill changed"; p.innerHTML = '<span class="dot"></span>changed · not rendered'; top.appendChild(p); }
    var play = document.createElement("button"); play.className = "btn small"; play.textContent = "▶ Play";
    play.onclick = function () { select(s.id); seek(s.start); setPlaying(true); };
    top.appendChild(play);
    el.appendChild(top);

    var line = document.createElement("div"); line.className = "preview-line";
    EB.tokenize(s.text).forEach(function (tok, i) {
      if (i) line.appendChild(document.createTextNode(" "));
      var n = document.createElement(tok.em ? "em" : "span"); n.textContent = tok.text; line.appendChild(n);
    });
    el.appendChild(line);

    var tabs = ["Text", "Style", "Place", "Motion", "Sound"], cur = openTab[s.id] || "Text";
    var tl = document.createElement("div"); tl.className = "tabs"; tl.setAttribute("role", "tablist");
    tabs.forEach(function (name) {
      var b = document.createElement("button"); b.textContent = name; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(name === cur));
      b.onclick = function () { openTab[s.id] = name; select(s.id); renderLeft(); };
      tl.appendChild(b);
    });
    el.appendChild(tl);

    var pane = document.createElement("div"); pane.className = "pane";
    if (cur === "Text") {
      var ta = document.createElement("textarea"); ta.id = "text-" + s.id; ta.rows = 2; ta.value = s.text; ta.disabled = !canWrite;
      ta.oninput = function () { edit(s.id, { text: ta.value }); };
      pane.appendChild(ta);
      pane.appendChild(hint('New line = line break. Wrap words in <code>*stars*</code> to make them pop.'));
    }
    if (cur === "Style") {
      pane.appendChild(chips(EB.STYLES, l.style, function (k) { edit(s.id, { look: { style: k } }); }, function (k, st) {
        var sm = document.createElement("span"); sm.className = "sample"; sm.textContent = st.upper ? "AA" : "Aa";
        sm.style.fontFamily = st.font; sm.style.fontWeight = st.weight || 400; return sm;
      }));
      pane.appendChild(hint(EB.STYLES[l.style].hint));
      pane.appendChild(slider("Size", 0.6, 1.6, 0.05, l.size, function (v) { return Math.round(v * 100) + "%"; }, function (v) { edit(s.id, { look: { size: v } }); }, "size-" + s.id));
    }
    if (cur === "Place") {
      var placeKey = Object.keys(EB.PLACES).filter(function (k) { return Math.abs(EB.PLACES[k].y - l.y) < 0.005; })[0];
      pane.appendChild(chips(EB.PLACES, placeKey, function (k) { edit(s.id, { look: { place: k, y: EB.PLACES[k].y } }); }));
      pane.appendChild(slider("Height", 0.06, 0.94, 0.01, l.y, function (v) { return Math.round(v * 100) + "%"; }, function (v) { edit(s.id, { look: { place: "custom", y: v } }); }, "y-" + s.id));
      pane.appendChild(hint("Turn on safe zones to keep text clear of the Reels buttons and caption."));
    }
    if (cur === "Motion") {
      pane.appendChild(chips(EB.MOTIONS, l.motion, function (k) { edit(s.id, { look: { motion: k } }); }));
      pane.appendChild(hint(l.motion === "build" ? "Words land in time with your voice." : "Plays as the caption appears."));
    }
    if (cur === "Sound") {
      pane.appendChild(chips(EB.SFX, l.sfx, function (k) { edit(s.id, { look: { sfx: k } }); playSfx(k); }));
      pane.appendChild(hint("Plays on the cut into this caption."));
    }
    el.appendChild(pane);

    var nr = document.createElement("div"); nr.className = "note-row";
    var note = document.createElement("textarea"); note.id = "note-" + s.id; note.placeholder = "A note for Claude about this moment, e.g. ‘make this one calmer’";
    note.value = (s.note && s.note.text) || "";
    var send = document.createElement("button"); send.className = "btn small"; send.textContent = "Send note"; send.disabled = !canWrite;
    send.onclick = function () { saveSegNote(s.id, note.value); };
    nr.append(note, send);
    el.appendChild(nr);
    if (s.note && s.note.text) {
      var sent = document.createElement("span"); sent.className = "sent";
      sent.textContent = s.note.done ? "Claude applied this note" : "Sent. Tell Claude: “apply my notes”";
      el.appendChild(sent);
    }
    el.addEventListener("click", function (e) { if (e.target === el || e.target.closest(".preview-line")) { select(s.id); seek(s.start); } });
    return el;
  }

  function hint(html) { var d = document.createElement("div"); d.className = "hint"; d.innerHTML = html; return d; }
  function chips(map, cur, onPick, extra) {
    var wrap = document.createElement("div"); wrap.className = "chips";
    Object.keys(map).forEach(function (k) {
      var b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", String(k === cur)); b.disabled = !canWrite;
      if (extra) b.appendChild(extra(k, map[k]));
      b.appendChild(document.createTextNode(map[k].label));
      b.onclick = function () { onPick(k); renderLeftSoon(); };
      wrap.appendChild(b);
    });
    return wrap;
  }
  function slider(label, min, max, step, val, show, onChange, id) {
    var row = document.createElement("label"); row.className = "slider";
    var a = document.createElement("span"); a.textContent = label;
    var i = document.createElement("input"); i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = val; i.id = id; i.disabled = !canWrite;
    var o = document.createElement("span"); o.className = "mono"; o.textContent = show(val);
    i.oninput = function () { var v = parseFloat(i.value); o.textContent = show(v); onChange(v); };
    row.append(a, i, o); return row;
  }
  function renderLeftSoon() { setTimeout(function () { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); renderLeft(); }, 0); }

  function select(id) {
    if (activeId === id) return;
    activeId = id;
    document.querySelectorAll(".card").forEach(function (c) { c.classList.toggle("is-active", c.dataset.id === id); });
    var all = document.querySelector(".list-head .btn"); if (all) all.disabled = !canWrite;
  }

  // Local edit: preview updates at once, saves after a short pause.
  function edit(id, patch) {
    var p = pending[id] || (pending[id] = {});
    if (patch.text != null) p.text = patch.text;
    if (patch.look) p.look = Object.assign({}, p.look, patch.look);
    select(id);
    drawFrame(); updateStatus();
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function () { flush(id); }, 600);
  }
  function flush(id) {
    var p = pending[id]; if (!p || !db) return Promise.resolve();
    var s = segs.filter(function (x) { return x.id === id; })[0]; if (!s) return Promise.resolve();
    var body = { changed: true };
    if (p.text != null) body.text = p.text;
    if (p.look) body.look = Object.assign({}, EB.look(s), p.look);
    return db.doc("segments/" + id).update(body).then(function () {
      if (pending[id] === p) delete pending[id];
    }).catch(function (e) { writeFailed(e); });
  }
  function applyLookToAll() {
    var src = liveSegs().filter(function (s) { return s.id === activeId; })[0]; if (!src) return;
    var lk = EB.look(src);
    segs.forEach(function (s) { if (s.id !== activeId) edit(s.id, { look: { style: lk.style, size: lk.size, motion: lk.motion, place: lk.place, y: lk.y } }); });
    toast("Applied #" + String(src.i + 1).padStart(4, "0") + "'s look to every caption");
    renderLeftSoon();
  }
  function saveSegNote(id, text) {
    if (!db) return;
    db.doc("segments/" + id).update({ note: { text: text.trim(), at: Date.now(), done: false } })
      .then(function () { toast("Note sent. Tell Claude in chat: “apply my notes”"); })
      .catch(writeFailed);
  }
  $("globalNoteBtn").onclick = function () {
    if (!db) return;
    var text = $("globalNote").value.trim(); if (!text) return;
    db.doc("project/main").update({ note: { text: text, at: Date.now(), done: false } })
      .then(function () { $("globalNoteSent").textContent = "Sent. Tell Claude: “apply my notes”"; })
      .catch(writeFailed);
  };
  function writeFailed(e) {
    if (e && e.code === "invalid_argument") { canWrite = false; toast("You can view this edit but not change it."); renderLeft(); }
    else toast("Couldn't save that change. Check your connection and try again.");
  }

  // ---------- Render ----------
  $("renderBtn").onclick = function () {
    if (!db || !project) return;
    var ids = Object.keys(pending);
    Promise.all(ids.map(flush)).then(function () {
      return db.doc("project/main").update({ render: { status: "requested", at: Date.now() } });
    }).then(function () { toast("Render requested. Tell Claude in chat: “render my edit”"); }).catch(writeFailed);
  };
  function renderRenders() {
    var r = project && project.render, panel = $("renderPanel");
    panel.hidden = !(r || renders.length);
    var msg = "";
    if (r && r.status === "requested") msg = "Requested. Tell Claude in chat: “render my edit”.";
    else if (r && r.status === "rendering") msg = "Claude is rendering. This page updates when it's done.";
    else if (r && r.status === "failed") msg = "The last render failed: " + (r.error || "ask Claude what happened.");
    else if (renders.length) msg = "Switch the monitor to “Latest render” to watch it.";
    $("renderMsg").textContent = msg;
    var box = $("renders"); box.replaceChildren();
    renders.slice(0, 5).forEach(function (rd, i) {
      var row = document.createElement("div"); row.className = "render-row";
      var w = document.createElement("span"); w.className = "when mono"; w.textContent = (rd.label || "Render") + " · " + new Date(rd.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      row.appendChild(w);
      if (i === 0) {
        var b = document.createElement("button"); b.className = "btn small"; b.textContent = "Watch";
        b.onclick = function () { $("viewSel").value = "render"; applySource(); seek(0); setPlaying(true); };
        row.appendChild(b);
      }
      box.appendChild(row);
    });
    var opt = $("viewSel").querySelector('option[value="render"]');
    opt.disabled = !renders.length;
    if (!renders.length && showingRender()) $("viewSel").value = "live";
  }

  function updateStatus() {
    var pill = $("statusPill"), txt = $("statusText");
    pill.className = "pill";
    if (demo || !project) { txt.textContent = "Waiting for a clip"; }
    else if (!segs.length) { txt.textContent = "Waiting for captions"; }
    else if (project.render && project.render.status === "rendering") { txt.textContent = "Rendering…"; }
    else {
      var n = changedCount();
      if (n) { pill.className = "pill changed"; txt.textContent = n + " changed · not rendered"; }
      else { pill.className = "pill ok"; txt.textContent = renders.length ? "Rendered" : "Ready to render"; }
    }
    $("renderBtn").disabled = demo || !segs.length || !canWrite || (project && project.render && /requested|rendering/.test(project.render.status));
    $("clipName").textContent = project && project.source ? project.source.name : "No clip yet";
  }

  // ---------- Upload ----------
  function uploadView() {
    var wrap = document.createElement("div"); wrap.className = "empty";
    var drop = document.createElement("div"); drop.className = "drop";
    drop.innerHTML = '<h2>Drop in a clip to start editing</h2><p>MP4, MOV or WebM up to 20 MB. A 30–60 second talking-head clip is perfect. The monitor is playing an example until then.</p>';
    var pick = document.createElement("button"); pick.className = "btn primary"; pick.textContent = "Choose a video";
    var input = document.createElement("input"); input.type = "file"; input.accept = "video/mp4,video/quicktime,video/webm,.mov,.mp4,.webm"; input.hidden = true; input.id = "fileIn";
    pick.onclick = function () { input.click(); };
    input.onchange = function () { if (input.files[0]) upload(input.files[0]); };
    drop.append(pick, input);
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { var f = e.dataTransfer.files[0]; if (f) upload(f); });
    if (!assets) { pick.disabled = true; drop.querySelector("p").textContent = "Uploading needs edit access to this page. Ask Claude to load your clip instead."; }

    var how = document.createElement("div"); how.className = "panel";
    how.innerHTML = '<h2>How it works</h2><ol class="steps">' +
      '<li><b>Upload a clip</b> here. Bigger than 20 MB? Put it in Google Drive and tell Claude the file name.</li>' +
      '<li><b>Tell Claude “prep my clip”.</b> It transcribes your voice into caption cards.</li>' +
      '<li><b>Style each card</b>: text, look, placement, motion and sound. The monitor updates live.</li>' +
      '<li><b>Hit Render video</b>, then tell Claude “render my edit”. The finished video shows up here.</li></ol>';
    wrap.append(drop, how);
    return wrap;
  }
  function waitingView() {
    var p = document.createElement("div"); p.className = "panel";
    p.innerHTML = '<h2>Clip uploaded</h2><p>Tell Claude in chat: <b>“prep my clip”</b>. It will transcribe your voice and lay out caption cards here. You can already scrub through the footage on the monitor.</p>';
    return p;
  }
  function upload(file) {
    if (!assets || !db) return;
    if (file.size > 20 * 1024 * 1024) { toast("That clip is " + (file.size / 1048576).toFixed(0) + " MB. The limit here is 20 MB, so put it in Google Drive and tell Claude the file name."); return; }
    var type = /webm$/i.test(file.name) ? "video/webm" : "video/mp4";
    toast("Uploading " + file.name + "…");
    assets.upload(file, { type: type }).then(function (r) {
      return db.doc("project/main").set({ source: { assetId: r.id, name: file.name, bytes: r.sizeBytes }, status: "uploaded", at: Date.now() });
    }).then(function () { toast("Uploaded. Now tell Claude in chat: “prep my clip”"); })
      .catch(function (e) {
        var m = { too_large: "That file is over 20 MB.", unsupported_type: "That file type isn't supported. Try an MP4.", quota_or_state: "Storage for this page is full." }[e && e.code];
        toast(m || "Upload failed. Try again in a moment.");
      });
  }

  // ---------- Data ----------
  function onProject(snap) {
    project = snap.exists ? snap.data() : null;
    var wasDemo = demo;
    demo = !(project && (project.source || project.proxy));
    if (wasDemo !== demo) { setPlaying(false); demoT = 0; }
    applySource(); renderLeft(); renderRenders(); updateStatus();
  }
  function onSegments(snap) {
    segs = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
    segs.sort(function (a, b) { return a.start - b.start; });
    segs.forEach(function (s, i) { s.i = i; });
    renderLeft(); drawFrame(); updateStatus();
  }
  function onRenders(snap) {
    renders = snap.docs.map(function (d) { return d.data(); }).sort(function (a, b) { return b.at - a.at; });
    renderRenders(); updateStatus();
    if (showingRender()) applySource();
  }

  renderLeft(); updateStatus(); drawFrame();
  setPlaying(true);

  if (window.claude && window.claude.use) {
    window.claude.use("assets").then(function (a) { assets = a; renderLeft(); });
    window.claude.use("user").then(function (u) {
      if (!u) return;
      Promise.resolve(u.can("data.write")).then(function (w) { if (w === false) { canWrite = false; renderLeft(); updateStatus(); } });
    });
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      var err = function () { toast("Lost the connection to your edit. Reload to reconnect."); };
      db.doc("project/main").onSnapshot(onProject, err);
      db.collection("segments").onSnapshot(onSegments, err);
      db.collection("renders").onSnapshot(onRenders, err);
    });
  }
})();
</script>
