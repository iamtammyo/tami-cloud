<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Edit Bay frame</title>
<style>
  /* Same families the Edit Bay page loads from Google Fonts, served locally. */
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-Regular.ttf"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("fonts/InstrumentSerif-Italic.ttf"); }
  @font-face { font-family: "Caveat"; font-weight: 400 700; src: url("fonts/Caveat.ttf"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("fonts/Inter.ttf"); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; container-type: size; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="overlay.js"></script>
<script>
  var stage = document.getElementById("stage"), segs = [];
  window.setup = async function (segments, w, h) {
    segs = segments;
    stage.style.width = w + "px";
    stage.style.height = h + "px";
    await Promise.all([
      "40px 'Archivo Black'", "40px 'Instrument Serif'", "italic 40px 'Instrument Serif'",
      "700 40px Caveat", "700 40px Inter"
    ].map(function (f) { return document.fonts.load(f); }));
    await document.fonts.ready;
    return true;
  };
  window.frame = function (t) { return EditBay.draw(stage, segs, t); };
</script>
</body>
</html>
