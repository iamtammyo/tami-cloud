<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tami Cloud Budget Tracker</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>💰 Tami Cloud Budget Tracker</h1>
            <p class="tagline">Track your spending across NGN and USD</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="transactions">Transactions</button>
            <button class="tab-btn" data-tab="budgets">Budgets</button>
            <button class="tab-btn" data-tab="categories">Categories</button>
        </nav>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="summary-cards">
                <div class="card">
                    <h3>NGN Balance</h3>
                    <div class="balance-display">
                        <div class="balance-item">
                            <span class="label">Income</span>
                            <span class="amount income" id="ngn-income">₦0</span>
                        </div>
                        <div class="balance-item">
                            <span class="label">Expenses</span>
                            <span class="amount expense" id="ngn-expenses">₦0</span>
                        </div>
                        <div class="balance-item net">
                            <span class="label">Net</span>
                            <span class="amount" id="ngn-net">₦0</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>USD Balance</h3>
                    <div class="balance-display">
                        <div class="balance-item">
                            <span class="label">Income</span>
                            <span class="amount income" id="usd-income">$0</span>
                        </div>
                        <div class="balance-item">
                            <span class="label">Expenses</span>
                            <span class="amount expense" id="usd-expenses">$0</span>
                        </div>
                        <div class="balance-item net">
                            <span class="label">Net</span>
                            <span class="amount" id="usd-net">$0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Spending by Category</h3>
                <div id="category-chart" class="category-chart"></div>
            </div>

            <div class="card">
                <h3>Recent Transactions</h3>
                <div id="recent-transactions" class="transaction-list"></div>
            </div>
        </div>

        <!-- Transactions Tab -->
        <div id="transactions" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>Add Transaction</h3>
                </div>
                <form id="transaction-form" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <select id="currency" required>
                                <option value="NGN">NGN (₦)</option>
                                <option value="USD">USD ($)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="transaction-type">Type</label>
                            <select id="transaction-type" required>
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="transaction-date">Date</label>
                            <input type="date" id="transaction-date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes (optional)</label>
                        <textarea id="notes" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>All Transactions</h3>
                    <div class="filters">
                        <select id="filter-currency">
                            <option value="">All Currencies</option>
                            <option value="NGN">NGN</option>
                            <option value="USD">USD</option>
                        </select>
                        <select id="filter-type">
                            <option value="">All Types</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                        <select id="filter-category">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>
                <div id="all-transactions" class="transaction-list"></div>
            </div>
        </div>

        <!-- Budgets Tab -->
        <div id="budgets" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>Create Budget</h3>
                </div>
                <form id="budget-form" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="budget-name">Budget Name</label>
                            <input type="text" id="budget-name" required>
                        </div>
                        <div class="form-group">
                            <label for="budget-amount">Amount</label>
                            <input type="number" id="budget-amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="budget-currency">Currency</label>
                            <select id="budget-currency" required>
                                <option value="NGN">NGN (₦)</option>
                                <option value="USD">USD ($)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="budget-period">Period</label>
                            <select id="budget-period" required>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                                <option value="yearly">Yearly</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="budget-category">Category (optional)</label>
                            <select id="budget-category">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="budget-start-date">Start Date</label>
                            <input type="date" id="budget-start-date" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Budget</button>
                </form>
            </div>

            <div class="card">
                <h3>Active Budgets</h3>
                <div id="budgets-list" class="budgets-list"></div>
            </div>
        </div>

        <!-- Categories Tab -->
        <div id="categories" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>Add Category</h3>
                </div>
                <form id="category-form" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category-name">Category Name</label>
                            <input type="text" id="category-name" required>
                        </div>
                        <div class="form-group">
                            <label for="category-icon">Icon</label>
                            <input type="text" id="category-icon" placeholder="🏷️" maxlength="2">
                        </div>
                        <div class="form-group">
                            <label for="category-color">Color</label>
                            <input type="color" id="category-color" value="#3498db">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="category-description">Description</label>
                        <input type="text" id="category-description">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Category</button>
                </form>
            </div>

            <div class="card">
                <h3>All Categories</h3>
                <div id="categories-list" class="categories-list"></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="/app.js"></script>
</body>
</html>
