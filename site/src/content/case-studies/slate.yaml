    poster:
      alt: ''
  - eyebrow: Video 2 · my own view
    title: I'm not a designer, and that's fine
    body: >-
      Tools should protect the creative effort, not use it up. This one leaned
      on Long to Shorts, Slate's AI for cutting long videos into short clips.
    videoUrl: ''
    poster:
      alt: ''
systemHeadline: The creative _system_
systemBody: >-
  Both videos share one visual language, so they read as a pair: a recurring
  guardrail motif, on-screen text in my brand font, and quick meme cuts like
  highway barriers and bumper bowling. I sent a moodboard for each video so
  approval took one round.
