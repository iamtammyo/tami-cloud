angles:
  - eyebrow: Video 1 · social team view
    title: Guardrails are underrated
    body: >-
      Speed is the job on a social team, but speed without guardrails is how a
      brand drifts. Slate's Brand Hub makes off-brand content hard to ship in
      the first place.
