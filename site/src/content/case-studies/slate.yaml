  items:
    - eyebrow: Video 1 · social team view
      title: Guardrails are underrated
      body: Speed is the job on a social team, but speed without guardrails is how a brand drifts. Slate's Brand Hub makes off-brand content hard to ship in the first place.
      label: "[Video 1 embed]"
    - eyebrow: Video 2 · my own view
      title: I'm not a designer, and that's fine
      body: Tools should protect the creative effort, not use it up. This one leaned on Long to Shorts, Slate's AI for cutting long videos into short clips.
      label: "[Video 2 embed]"
system:
  headline: The creative _system_
  body: "Both videos share one visual language, so they read as a pair: a recurring guardrail motif, on-screen text in my brand font, and quick meme cuts like highway barriers and bumper bowling. I sent a moodboard for each video so approval took one round."
